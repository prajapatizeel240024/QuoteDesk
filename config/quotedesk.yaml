evals:
  # Assumptions for the modeled rep time in eval reports. They are estimates, not measurements.
  time_model:
    manual_minutes_per_rfq: 6
    manual_minutes_per_line: 4
    assisted_minutes_per_rfq: 2
    assisted_minutes_per_clean_line: 0.5
    assisted_minutes_per_flagged_line: 2.5
