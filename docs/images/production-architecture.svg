<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">QuoteDesk production design (plan only)</title>
  <desc id="desc">A plan, not a deployment. Inside the distributor's private network: an intake service takes RFQ emails and uploads, keeps originals in object storage and puts one job per RFQ on a queue. Pipeline workers run the same seven stages as today, use an OCR service for scanned PDFs, call Claude only through an LLM gateway, and write to a managed Postgres. The web app, behind single sign-on with roles, is where reps review lines and compliance reviewers clear export holds. An ERP sync keeps the catalog, stock and costs current and sends draft POs back. Approved quotes go out through an email sending service. Secrets, observability and a CI eval gate support it all.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 14.5px; fill: #475569; }
    .lab { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
    .bt { font-size: 13.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #334155; }
    .note { font-size: 11.5px; fill: #64748b; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #92400e; }
    .vio { fill: #5b21b6; }
    .grn { fill: #065f46; }
    .amb { fill: #92400e; }
    .c { text-anchor: middle; }
    .code { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .db { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .ui { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
    .ext { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .extai { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .person { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .ops { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
    .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="959" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="52" class="h1">Production design</text>
  <rect x="292" y="31" width="214" height="28" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="399" y="50" class="pill c">PLAN ONLY · NOT DEPLOYED</text>
  <text x="40" y="84" class="sub">How the same pipeline would run for a real distributor. Nothing here is built: today QuoteDesk runs only on localhost.</text>

  <!-- private network -->
  <rect x="270" y="120" width="740" height="760" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="290" y="148" class="lab">PRIVATE NETWORK · THE DISTRIBUTOR'S OWN CLOUD ACCOUNT</text>

  <!-- outside services, left -->
  <rect x="40" y="420" width="200" height="100" rx="10" class="ext"/>
  <text x="56" y="444" class="bt">Quote mailbox</text>
  <text x="56" y="464" class="s">IMAP, Microsoft Graph</text>
  <text x="56" y="481" class="s">or Gmail API</text>
  <text x="56" y="498" class="s">RFQ emails come in here</text>

  <rect x="40" y="600" width="200" height="100" rx="10" class="ext"/>
  <text x="56" y="624" class="bt">ERP</text>
  <text x="56" y="644" class="s">catalog, stock, costs,</text>
  <text x="56" y="661" class="s">customer part numbers;</text>
  <text x="56" y="678" class="s">receives draft POs</text>

  <!-- outside services, right -->
  <rect x="1040" y="250" width="200" height="80" rx="10" class="extai"/>
  <text x="1056" y="274" class="bt vio">Claude API</text>
  <text x="1056" y="294" class="s vio">screened text only,</text>
  <text x="1056" y="311" class="s vio">through the gateway</text>

  <rect x="1040" y="420" width="200" height="100" rx="10" class="ext"/>
  <text x="1056" y="444" class="bt">Email sending</text>
  <text x="1056" y="464" class="s">approved quotes and</text>
  <text x="1056" y="481" class="s">buyer questions, sent only</text>
  <text x="1056" y="498" class="s">after a person approves</text>

  <rect x="1040" y="560" width="200" height="72" rx="10" class="ext"/>
  <text x="1056" y="584" class="bt">Single sign-on</text>
  <text x="1056" y="604" class="s">the company's identity</text>
  <text x="1056" y="621" class="s">provider</text>

  <rect x="1040" y="670" width="200" height="64" rx="10" class="person"/>
  <text x="1056" y="694" class="bt amb">Reps and</text>
  <text x="1056" y="712" class="bt amb">compliance reviewers</text>

  <!-- above the main row -->
  <rect x="290" y="196" width="180" height="104" rx="10" class="db"/>
  <text x="306" y="220" class="bt grn">Object storage</text>
  <text x="306" y="240" class="s">original emails and files,</text>
  <text x="306" y="257" class="s">encrypted, kept for audit</text>
  <text x="306" y="274" class="s">and re-parsing</text>

  <rect x="490" y="196" width="160" height="80" rx="10" class="code"/>
  <text x="506" y="220" class="bt">OCR</text>
  <text x="506" y="240" class="s">text for scanned PDFs</text>
  <text x="506" y="257" class="s">that have no text layer</text>

  <rect x="670" y="170" width="320" height="160" rx="12" class="ai"/>
  <text x="686" y="194" class="bt vio">LLM gateway</text>
  <text x="686" y="214" class="s vio">the same <tspan class="mono">client.ts</tspan> contract: schema, zod,</text>
  <text x="686" y="231" class="s vio">log and cache on every call</text>
  <text x="686" y="251" class="s vio">a held-text guard before anything is sent</text>
  <text x="686" y="268" class="s vio">token budgets, timeouts, retries</text>
  <text x="686" y="285" class="s vio">refusal fallback, cost per RFQ</text>
  <text x="686" y="302" class="s vio">pinned models and prompt versions</text>

  <!-- main row -->
  <rect x="290" y="400" width="120" height="160" rx="10" class="code"/>
  <text x="350" y="426" class="bt c">Intake</text>
  <text x="350" y="448" class="s c">email and</text>
  <text x="350" y="465" class="s c">upload</text>
  <text x="350" y="482" class="s c">parse once</text>
  <text x="350" y="499" class="s c">find customer</text>

  <rect x="430" y="400" width="120" height="160" rx="10" class="code"/>
  <text x="490" y="426" class="bt c">Job queue</text>
  <text x="490" y="448" class="s c">one job</text>
  <text x="490" y="465" class="s c">per RFQ</text>
  <text x="490" y="482" class="s c">retries,</text>
  <text x="490" y="499" class="s c">dead letters</text>

  <rect x="570" y="400" width="140" height="160" rx="10" class="code"/>
  <text x="640" y="426" class="bt c">Pipeline workers</text>
  <text x="640" y="448" class="s c">the same 7 stages</text>
  <text x="640" y="465" class="s c">as today</text>
  <text x="640" y="482" class="s c">claim the RFQ</text>
  <text x="640" y="499" class="s c">in the database</text>
  <text x="640" y="516" class="s c">scale out</text>

  <rect x="730" y="400" width="110" height="160" rx="10" class="db"/>
  <text x="785" y="426" class="bt c grn">Postgres</text>
  <text x="785" y="448" class="s c">managed,</text>
  <text x="785" y="465" class="s c">private,</text>
  <text x="785" y="482" class="s c">backed up</text>
  <text x="785" y="499" class="s c">audit table</text>
  <text x="785" y="516" class="s c">locked down</text>

  <rect x="870" y="400" width="120" height="160" rx="10" class="ui"/>
  <text x="930" y="426" class="bt c">Web app</text>
  <text x="930" y="448" class="s c">review screen</text>
  <text x="930" y="465" class="s c">SSO login</text>
  <text x="930" y="482" class="s c">role checks</text>
  <text x="930" y="499" class="s c">compliance</text>
  <text x="930" y="516" class="s c">clears holds</text>

  <!-- below -->
  <rect x="600" y="600" width="250" height="100" rx="10" class="code"/>
  <text x="616" y="624" class="bt">ERP sync</text>
  <text x="616" y="644" class="s">catalog, stock and costs on a</text>
  <text x="616" y="661" class="s">schedule, stock checks on demand,</text>
  <text x="616" y="678" class="s">draft POs back to the ERP</text>

  <rect x="290" y="760" width="200" height="100" rx="10" class="ops"/>
  <text x="306" y="784" class="bt">Secrets manager</text>
  <text x="306" y="804" class="s">API key and database</text>
  <text x="306" y="821" class="s">credentials, rotated;</text>
  <text x="306" y="838" class="s">no keys in env files</text>

  <rect x="510" y="760" width="230" height="100" rx="10" class="ops"/>
  <text x="526" y="784" class="bt">Observability</text>
  <text x="526" y="804" class="s">logs, metrics, traces, alerts:</text>
  <text x="526" y="821" class="s">time to quote, auto-match rate,</text>
  <text x="526" y="838" class="s">held lines, Claude cost</text>

  <rect x="760" y="760" width="230" height="100" rx="10" class="ops"/>
  <text x="776" y="784" class="bt">CI with an eval gate</text>
  <text x="776" y="804" class="s">tests and the dev eval with</text>
  <text x="776" y="821" class="s">Claude before any prompt,</text>
  <text x="776" y="838" class="s">model or threshold change</text>

  <!-- arrows -->
  <line x1="241" y1="470" x2="288" y2="470" class="arrow" marker-end="url(#ag)"/>
  <line x1="411" y1="480" x2="429" y2="480" class="arrow" marker-end="url(#ag)"/>
  <line x1="551" y1="480" x2="569" y2="480" class="arrow" marker-end="url(#ag)"/>
  <line x1="711" y1="480" x2="729" y2="480" class="arrow" marker-end="url(#ag)"/>
  <line x1="842" y1="480" x2="868" y2="480" class="arrow" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <line x1="350" y1="399" x2="350" y2="302" class="arrow" marker-end="url(#ag)"/>
  <line x1="600" y1="398" x2="600" y2="278" class="arrow" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <line x1="680" y1="399" x2="680" y2="333" class="arrow" style="stroke:#7c3aed" marker-end="url(#ap)"/>
  <line x1="992" y1="290" x2="1038" y2="290" class="arrow" style="stroke:#7c3aed" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <line x1="991" y1="470" x2="1038" y2="470" class="arrow" marker-end="url(#ag)"/>
  <line x1="1140" y1="669" x2="1140" y2="634" class="arrow" marker-end="url(#ag)"/>
  <path d="M1038,596 H930 V563" class="arrow" marker-end="url(#ag)"/>
  <line x1="242" y1="650" x2="598" y2="650" class="arrow" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <line x1="785" y1="599" x2="785" y2="563" class="arrow" marker-end="url(#ag)"/>
  <text x="300" y="642" class="note">catalog in, draft POs out</text>

  <!-- legend -->
  <rect x="40" y="913" width="16" height="12" rx="3" class="code"/><text x="62" y="923" class="s">Service we run</text>
  <rect x="170" y="913" width="16" height="12" rx="3" class="ai"/><text x="192" y="923" class="s">Claude</text>
  <rect x="254" y="913" width="16" height="12" rx="3" class="db"/><text x="276" y="923" class="s">Data</text>
  <rect x="330" y="913" width="16" height="12" rx="3" class="ui"/><text x="352" y="923" class="s">Web app</text>
  <rect x="424" y="913" width="16" height="12" rx="3" class="person"/><text x="446" y="923" class="s">People</text>
  <rect x="510" y="913" width="16" height="12" rx="3" class="ext"/><text x="532" y="923" class="s">Outside service</text>
  <rect x="640" y="913" width="16" height="12" rx="3" class="ops"/><text x="662" y="923" class="s">Operations</text>
</svg>
