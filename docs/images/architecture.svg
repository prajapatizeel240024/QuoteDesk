<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
  <title id="title">QuoteDesk architecture today</title>
  <desc id="desc">An RFQ email, the YAML config and the ERP export feed a seven-stage drafting pipeline on one machine: ingest, extract, match, price, check, save and ask. Extract, match and ask can call Claude, always through one LLM client, which is the only connection that leaves the machine. Saved lines go through the lines service into local Postgres. A sales rep reviews them on the Next.js review screen, which builds the quote email and supplier PO drafts as text.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 14.5px; fill: #475569; }
    .bt { font-size: 14px; font-weight: 700; }
    .bl { font-size: 15px; font-weight: 700; }
    .p { font-size: 10.5px; fill: #475569; }
    .s { font-size: 11px; fill: #334155; }
    .m { font-size: 12px; fill: #334155; }
    .note { font-size: 11.5px; fill: #64748b; }
    .lab { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
    .pl { font-size: 12.5px; font-weight: 700; fill: #334155; }
    .chipt { font-size: 11px; fill: #065f46; }
    .pill { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .red { font-size: 10.5px; font-weight: 700; fill: #b91c1c; }
    .blue { font-size: 10.5px; font-weight: 700; fill: #1d4ed8; }
    .gray { font-size: 10.5px; font-weight: 700; fill: #64748b; }
    .vio { fill: #5b21b6; }
    .grn { fill: #065f46; }
    .amb { fill: #92400e; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .code { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .db { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .in { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; }
    .ui { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
    .person { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .chip { fill: #ffffff; stroke: #6ee7b7; stroke-width: 1; }
    .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .call { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="999" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="52" class="h1">QuoteDesk architecture (today)</text>
  <text x="40" y="80" class="sub">Everything runs on one machine. The only call that leaves it goes to Claude, and only for text the rules can't handle.</text>

  <!-- the machine -->
  <rect x="24" y="214" width="1232" height="730" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="44" y="242" class="lab">THIS MACHINE · 127.0.0.1 ONLY</text>

  <!-- Claude, outside -->
  <rect x="480" y="100" width="320" height="68" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="128" class="bl c vio">Claude API (Anthropic)</text>
  <text x="640" y="150" class="m c vio">the only service outside this machine</text>
  <line x1="640" y1="171" x2="640" y2="249" class="arrow" style="stroke:#7c3aed" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <text x="654" y="188" class="note vio">HTTPS, only when LLM_MODE=anthropic</text>
  <text x="654" y="204" class="note vio">and the response cache has no answer</text>

  <!-- LLM client -->
  <rect x="460" y="252" width="360" height="92" rx="12" class="ai"/>
  <text x="640" y="277" class="bl c vio">LLM client</text>
  <text x="640" y="296" class="p mono c vio">src/server/llm/client.ts</text>
  <text x="640" y="316" class="m c vio">one entry point · JSON schema · zod check</text>
  <text x="640" y="334" class="m c vio">every call logged · answers cached in llm_calls</text>

  <!-- config -->
  <rect x="44" y="252" width="192" height="92" rx="10" class="in"/>
  <text x="60" y="277" class="bt">Config</text>
  <text x="60" y="296" class="p mono">config/quotedesk.yaml</text>
  <text x="60" y="315" class="s">customers, pricing, rules,</text>
  <text x="60" y="332" class="s">screening terms, headers</text>
  <path d="M237,298 H362 V382" class="arrow" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="246" y="290" class="note">read by every stage</text>

  <!-- pipeline -->
  <rect x="256" y="384" width="980" height="152" rx="14" class="group"/>
  <text x="272" y="404" class="pl">Drafting pipeline</text>
  <text x="626" y="404" class="note">stages 2 to 7 run in src/server/pipeline.ts (runRfq) and stream progress</text>

  <rect x="272" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="332" y="446" class="bt c">1 · Load</text>
  <text x="332" y="465" class="p mono c">ingest/</text>
  <text x="332" y="483" class="s c">parse files once</text>

  <rect x="410" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="470" y="446" class="bt c">2 · Extract</text>
  <text x="470" y="465" class="p mono c">extract/</text>
  <text x="470" y="483" class="s c">rules, then Claude</text>
  <text x="470" y="505" class="red c">screening first</text>

  <rect x="548" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="608" y="446" class="bt c">3 · Match</text>
  <text x="608" y="465" class="p mono c">match/</text>
  <text x="608" y="483" class="s c">rules, then Claude</text>
  <text x="608" y="505" class="red c">4-check bar</text>

  <rect x="686" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="746" y="446" class="bt c">4 · Price</text>
  <text x="746" y="465" class="p mono c">pricing/engine.ts</text>
  <text x="746" y="483" class="s c">integer cents</text>
  <text x="746" y="505" class="blue c">code only</text>

  <rect x="824" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="884" y="446" class="bt c">5 · Check</text>
  <text x="884" y="465" class="p mono c">checks/rules.ts</text>
  <text x="884" y="483" class="s c">13 flag codes</text>

  <rect x="962" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="1022" y="446" class="bt c">6 · Save</text>
  <text x="1022" y="465" class="p mono c">lines/</text>
  <text x="1022" y="483" class="s c">+ customer rules</text>
  <text x="1022" y="505" class="blue c">one transaction</text>

  <rect x="1100" y="416" width="120" height="104" rx="10" class="code"/>
  <text x="1160" y="446" class="bt c">7 · Ask</text>
  <text x="1160" y="465" class="p mono c">questions/</text>
  <text x="1160" y="483" class="s c">draft for the buyer</text>
  <text x="1160" y="505" class="gray c">or a template</text>

  <!-- Claude pills -->
  <rect x="478" y="407" width="46" height="17" rx="8.5" fill="#7c3aed"/>
  <text x="501" y="419.5" class="pill c">Claude</text>
  <rect x="616" y="407" width="46" height="17" rx="8.5" fill="#7c3aed"/>
  <text x="639" y="419.5" class="pill c">Claude</text>
  <rect x="1168" y="407" width="46" height="17" rx="8.5" fill="#7c3aed"/>
  <text x="1191" y="419.5" class="pill c">Claude</text>

  <!-- stage arrows -->
  <line x1="393" y1="468" x2="409" y2="468" class="arrow" marker-end="url(#ag)"/>
  <line x1="531" y1="468" x2="547" y2="468" class="arrow" marker-end="url(#ag)"/>
  <line x1="669" y1="468" x2="685" y2="468" class="arrow" marker-end="url(#ag)"/>
  <line x1="807" y1="468" x2="823" y2="468" class="arrow" marker-end="url(#ag)"/>
  <line x1="945" y1="468" x2="961" y2="468" class="arrow" marker-end="url(#ag)"/>
  <line x1="1083" y1="468" x2="1099" y2="468" class="arrow" marker-end="url(#ag)"/>

  <!-- calls to the LLM client -->
  <line x1="470" y1="414" x2="470" y2="347" class="call" marker-end="url(#ap)"/>
  <line x1="608" y1="414" x2="608" y2="347" class="call" marker-end="url(#ap)"/>
  <path d="M1160,414 V300 H823" class="call" marker-end="url(#ap)"/>
  <text x="832" y="292" class="note vio">only for what the rules can't read or settle</text>

  <!-- RFQ email -->
  <rect x="44" y="416" width="192" height="104" rx="10" class="in"/>
  <text x="60" y="441" class="bt">RFQ email</text>
  <text x="60" y="460" class="p mono">evals/rfqs/rfq-NN/</text>
  <text x="60" y="479" class="s">message.json + .xlsx or .pdf</text>
  <text x="60" y="497" class="s">15 synthetic RFQs</text>
  <line x1="237" y1="468" x2="270" y2="468" class="arrow" marker-end="url(#ag)"/>

  <!-- ERP export -->
  <rect x="44" y="576" width="192" height="104" rx="10" class="in"/>
  <text x="60" y="601" class="bt">ERP export</text>
  <text x="60" y="620" class="p mono">data/erp/*.csv</text>
  <text x="60" y="638" class="s">catalog, suppliers,</text>
  <text x="60" y="656" class="s">customer part numbers</text>
  <line x1="237" y1="628" x2="254" y2="628" class="arrow" marker-end="url(#ag)"/>

  <!-- evals -->
  <rect x="44" y="716" width="192" height="136" rx="10" class="in"/>
  <text x="60" y="741" class="bt">Evals</text>
  <text x="60" y="760" class="p mono">evals/</text>
  <text x="60" y="779" class="s">answer key per RFQ</text>
  <text x="60" y="797" class="s">same pipeline, then scored</text>
  <text x="60" y="815" class="s">runner, scorer, reports</text>
  <text x="60" y="835" class="s vio">oracle stand-in: tests only</text>

  <!-- Postgres -->
  <rect x="256" y="576" width="600" height="130" rx="12" class="db"/>
  <text x="276" y="601" class="bl grn">Postgres 16 · local only</text>
  <text x="836" y="601" class="note e grn">db.ts refuses non-local hosts</text>
  <rect x="276" y="614" width="44" height="22" rx="6" class="chip"/><text x="298" y="629" class="chipt mono c">rfqs</text>
  <rect x="328" y="614" width="104" height="22" rx="6" class="chip"/><text x="380" y="629" class="chipt mono c">rfq_documents</text>
  <rect x="440" y="614" width="90" height="22" rx="6" class="chip"/><text x="485" y="629" class="chipt mono c">quote_lines</text>
  <rect x="538" y="614" width="84" height="22" rx="6" class="chip"/><text x="580" y="629" class="chipt mono c">line_flags</text>
  <rect x="630" y="614" width="116" height="22" rx="6" class="chip"/><text x="688" y="629" class="chipt mono c">buyer_questions</text>
  <rect x="276" y="644" width="58" height="22" rx="6" class="chip"/><text x="305" y="659" class="chipt mono c">quotes</text>
  <rect x="342" y="644" width="116" height="22" rx="6" class="chip"/><text x="400" y="659" class="chipt mono c">purchase_orders</text>
  <rect x="466" y="644" width="50" height="22" rx="6" class="chip"/><text x="491" y="659" class="chipt mono c">parts</text>
  <rect x="524" y="644" width="76" height="22" rx="6" class="chip"/><text x="562" y="659" class="chipt mono c">customers</text>
  <rect x="608" y="644" width="104" height="22" rx="6" class="chip"/><text x="660" y="659" class="chipt mono c">customer_xref</text>
  <rect x="720" y="644" width="76" height="22" rx="6" class="chip"/><text x="758" y="659" class="chipt mono c">suppliers</text>
  <rect x="276" y="674" width="196" height="22" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1"/><text x="374" y="689" class="chipt mono c" style="fill:#991b1b">audit_events · append-only</text>
  <rect x="480" y="674" width="222" height="22" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1"/><text x="591" y="689" class="chipt mono c" style="fill:#5b21b6">llm_calls · Claude log + cache</text>

  <line x1="332" y1="521" x2="332" y2="574" class="arrow" marker-end="url(#ag)"/>
  <text x="340" y="552" class="note">stores parsed files</text>

  <!-- lines service -->
  <rect x="896" y="576" width="340" height="96" rx="12" class="code"/>
  <text x="912" y="601" class="bl">Lines service</text>
  <text x="912" y="620" class="p mono">src/server/lines/</text>
  <text x="912" y="639" class="s">the only writer of quote lines and flags</text>
  <text x="912" y="657" class="s">row lock · version check · one audit row per change</text>
  <line x1="1022" y1="521" x2="1022" y2="574" class="arrow" marker-end="url(#ag)"/>
  <text x="1030" y="552" class="note">inserts the lines</text>
  <line x1="895" y1="624" x2="858" y2="624" class="arrow" marker-end="url(#ag)"/>

  <!-- review screen -->
  <rect x="896" y="716" width="340" height="136" rx="12" class="ui"/>
  <text x="912" y="741" class="bl">Review screen</text>
  <text x="912" y="760" class="p mono">Next.js · 127.0.0.1:3000</text>
  <text x="912" y="779" class="s">Inbox, Needs a part, export holds,</text>
  <text x="912" y="797" class="s">question for the buyer, line actions,</text>
  <text x="912" y="815" class="s">Why this line, History</text>
  <text x="912" y="835" class="s">17 API routes: GET reads, POST/PATCH writes</text>
  <line x1="1066" y1="715" x2="1066" y2="675" class="arrow" marker-end="url(#ag)"/>
  <text x="1076" y="699" class="note">every change</text>

  <!-- outputs -->
  <rect x="256" y="732" width="600" height="120" rx="12" class="group"/>
  <text x="272" y="753" class="pl">Made from approved lines when the rep asks</text>
  <rect x="272" y="764" width="276" height="76" rx="10" class="code"/>
  <text x="288" y="786" class="bt">Quote email</text>
  <text x="288" y="804" class="p mono">export/quote-email.ts</text>
  <text x="288" y="822" class="s">plain text · nothing is sent</text>
  <rect x="564" y="764" width="276" height="76" rx="10" class="code"/>
  <text x="580" y="786" class="bt">Supplier PO drafts</text>
  <text x="580" y="804" class="p mono">export/purchase-orders.ts</text>
  <text x="580" y="822" class="s">one per supplier · nothing is sent</text>
  <line x1="895" y1="790" x2="858" y2="790" class="arrow" marker-end="url(#ag)"/>

  <!-- the rep -->
  <rect x="986" y="880" width="160" height="38" rx="19" class="person"/>
  <text x="1066" y="904" class="bt c amb">Sales rep</text>
  <line x1="1066" y1="879" x2="1066" y2="855" class="arrow" marker-end="url(#ag)"/>

  <!-- legend -->
  <rect x="40" y="963" width="16" height="12" rx="3" class="code"/><text x="62" y="973" class="s">Rules and code</text>
  <rect x="170" y="963" width="16" height="12" rx="3" class="ai"/><text x="192" y="973" class="s">Claude</text>
  <rect x="254" y="963" width="16" height="12" rx="3" class="db"/><text x="276" y="973" class="s">Local data</text>
  <rect x="354" y="963" width="16" height="12" rx="3" class="person"/><text x="376" y="973" class="s">Person</text>
  <text x="440" y="973" class="red" style="font-size:11px">red text</text><text x="490" y="973" class="s">safety check</text>
  <line x1="580" y1="969" x2="612" y2="969" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/><text x="620" y="973" class="s">call to Claude, through the LLM client</text>
  <line x1="852" y1="969" x2="884" y2="969" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/><text x="892" y="973" class="s">the machine boundary</text>
</svg>
